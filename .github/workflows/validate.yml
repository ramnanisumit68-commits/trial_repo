name: Validate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: ./scripts/validate.sh
